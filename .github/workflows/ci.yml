name: Сборка и тесты

# Checks every commit to main and every pull request. Runs on Windows because
# the application is Windows-only and uses WPF.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'Референсы и дизайн/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new commit to the same branch cancels the build still in progress.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка и тесты
    runs-on: windows-latest

    steps:
      - name: Забрать исходники
        uses: actions/checkout@v4

      - name: Поставить .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Кэш пакетов NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Восстановить пакеты
        run: dotnet restore MusicScanIntegrity.sln

      # BASS is only needed by the decoding integration tests. If un4seen is
      # unreachable the build must not fail; those tests mark themselves skipped.
      - name: Скачать библиотеки BASS
        id: bass
        continue-on-error: true
        run: pwsh tools/fetch-bass.ps1

      - name: Собрать
        run: dotnet build MusicScanIntegrity.sln -c Release --no-restore

      - name: Прогнать тесты
        run: >
          dotnet test MusicScanIntegrity.sln
          -c Release --no-build
          --logger "trx;LogFileName=tests.trx"
          --results-directory artifacts/test-results

      # Test results are a convenience, not a success condition: a failed upload
      # (e.g. storage quota exceeded) must not fail the build. The test outcome
      # is already known from the previous step.
      - name: Сохранить результаты тестов
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
          retention-days: 7

      - name: Предупредить, если BASS не скачалась
        if: steps.bass.outcome == 'failure'
        run: |
          Write-Host '::warning::Библиотеки BASS не скачались — интеграционные тесты декодирования пропущены.'

      # The portable build is ~65 MB and used to be uploaded on every commit to
      # main. Free Actions storage is 0.5 GB per account, so two weeks of
      # retention piled up 2.9 GB — five times the quota for files nobody
      # downloaded.
      #
      # release.yml publishes the same build as a release asset, which does not
      # count toward that storage. Here it is built only on manual runs, when a
      # build between releases is actually needed, and kept for one day.
      - name: Собрать переносимую версию
        if: github.event_name == 'workflow_dispatch'
        run: >
          dotnet publish src/MusicScanIntegrity.App/MusicScanIntegrity.App.csproj
          -c Release -r win-x64 --self-contained true
          -o artifacts/publish --nologo

      - name: Приложить переносимую версию к сборке
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Music_Scan_Integrity-portable
          path: artifacts/publish
          retention-days: 1
