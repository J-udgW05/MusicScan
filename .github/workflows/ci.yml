name: Сборка и тесты

# Проверяет каждый коммит в main и каждый pull request.
# Сборка идёт на Windows: программа только под Windows и использует WPF.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'Референсы и дизайн/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Новый коммит в ту же ветку отменяет предыдущую, ещё не доехавшую сборку.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка и тесты
    runs-on: windows-latest

    steps:
      - name: Забрать исходники
        uses: actions/checkout@v4

      - name: Поставить .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Кэш пакетов NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Восстановить пакеты
        run: dotnet restore MusicScanIntegrity.sln

      # Библиотеки BASS нужны только интеграционным тестам декодирования.
      # Если сайт un4seen недоступен, сборку это ронять не должно: такие тесты
      # сами пометятся пропущенными.
      - name: Скачать библиотеки BASS
        id: bass
        continue-on-error: true
        run: pwsh tools/fetch-bass.ps1

      - name: Собрать
        run: dotnet build MusicScanIntegrity.sln -c Release --no-restore

      - name: Прогнать тесты
        run: >
          dotnet test MusicScanIntegrity.sln
          -c Release --no-build
          --logger "trx;LogFileName=tests.trx"
          --results-directory artifacts/test-results

      # Результаты тестов — удобство, а не условие успеха: если выгрузка не
      # удалась (например, исчерпана квота хранилища), сборка из-за этого
      # падать не должна. Сам итог тестов уже известен шагом выше.
      - name: Сохранить результаты тестов
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
          retention-days: 7

      - name: Предупредить, если BASS не скачалась
        if: steps.bass.outcome == 'failure'
        run: |
          Write-Host '::warning::Библиотеки BASS не скачались — интеграционные тесты декодирования пропущены.'

      # Переносимая сборка весит ~65 МБ, и раньше она откладывалась на каждый
      # коммит в main. Бесплатного хранилища Actions — 0,5 ГБ на весь аккаунт,
      # так что за две недели хранения накапливалось 2,9 ГБ: пятикратный
      # перебор квоты ради файлов, которые никто не скачивал.
      #
      # Та же самая сборка публикуется как файл выпуска в release.yml, а файлы
      # выпусков в это хранилище не считаются вообще. Поэтому здесь она
      # собирается только по ручному запуску — когда сборка между выпусками
      # действительно нужна, — и живёт сутки.
      - name: Собрать переносимую версию
        if: github.event_name == 'workflow_dispatch'
        run: >
          dotnet publish src/MusicScanIntegrity.App/MusicScanIntegrity.App.csproj
          -c Release -r win-x64 --self-contained true
          -o artifacts/publish --nologo

      - name: Приложить переносимую версию к сборке
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Music_Scan_Integrity-portable
          path: artifacts/publish
          retention-days: 1
